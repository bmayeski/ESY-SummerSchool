<style>
/* ============================================================
   CSS_Nav.html — Sidebar navigation
============================================================ */

.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  z-index: 50;
  overflow-y: auto;
  overflow-x: hidden;
  transition: transform var(--transition);
}

/* Header */
.sidebar-header {
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
  border-bottom: 1px solid var(--sidebar-border);
  flex-shrink: 0;
}
.sidebar-logo { display: flex; align-items: center; gap: var(--sp-3); }
.sidebar-logo-icon {
  width: 36px; height: 36px;
  background: var(--color-primary-light);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sidebar-logo-icon svg { color: #fff; }
.sidebar-logo-text { display: flex; flex-direction: column; }
.sidebar-logo-text .district {
  font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: rgba(255,255,255,0.4); line-height: 1.2;
}
.sidebar-logo-text .app-name {
  font-size: 0.875rem; font-weight: 700;
  color: #fff; line-height: 1.3;
}

/* Nav */
.sidebar-nav {
  flex: 1;
  padding: var(--sp-4) var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-1);
}
.nav-section-label {
  font-size: 0.6875rem; font-weight: 700;
  letter-spacing: 0.09em; text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  padding: var(--sp-3) var(--sp-3) var(--sp-1);
  margin-top: var(--sp-2);
}
.nav-section-label:first-child { margin-top: 0; }

.nav-item {
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%;
  padding: var(--sp-3) var(--sp-3);
  border-radius: var(--r-md);
  border: none; background: transparent;
  color: var(--sidebar-text);
  font-size: 0.875rem; font-weight: 500;
  text-align: left; cursor: pointer;
  transition: background var(--transition), color var(--transition);
  position: relative; line-height: 1.3;
}
.nav-item:hover { background: var(--sidebar-hover-bg); color: #fff; }
.nav-item.active {
  background: var(--sidebar-active-bg);
  color: var(--sidebar-active-text);
  font-weight: 600;
}
.nav-item.active::before {
  content: '';
  position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; background: var(--color-primary-light);
  border-radius: 0 2px 2px 0;
}
.nav-icon {
  width: 18px; height: 18px; flex-shrink: 0;
  opacity: 0.7; transition: opacity var(--transition);
}
.nav-item.active .nav-icon,
.nav-item:hover  .nav-icon { opacity: 1; }
.nav-item span:not(.nav-badge) { flex: 1; }

.nav-badge {
  font-size: 0.6875rem; font-weight: 700;
  letter-spacing: 0.04em;
  padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
}
.nav-item[data-tab="cert-esy"]  .nav-badge { background:rgba(200,16,46,0.25);  color:#ff8fa3; }
.nav-item[data-tab="cert-ss"]   .nav-badge { background:rgba(232,119,34,0.25); color:#ffc27a; }
.nav-item[data-tab="class-esy"] .nav-badge { background:rgba(26,122,74,0.25);  color:#6ee7a0; }
.nav-item[data-tab="admin"]     .nav-badge { background:rgba(109,40,217,0.25); color:#c4b5fd; }

/* Footer */
.sidebar-footer {
  padding: var(--sp-4) var(--sp-5);
  border-top: 1px solid var(--sidebar-border);
  flex-shrink: 0;
}
.sidebar-footer-year  { font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.5); }
.sidebar-footer-name  { font-size: 0.6875rem; color: rgba(255,255,255,0.28); margin-top: 2px; }

/* Mobile */
.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.45); z-index: 45;
}
.mobile-header {
  display: none; align-items: center; gap: var(--sp-3);
  background: var(--color-primary-dark);
  padding: var(--sp-3) var(--sp-5);
  position: sticky; top: 0; z-index: 40;
  box-shadow: var(--shadow-md);
}
.mobile-header-title { color: #fff; font-weight: 600; font-size: 0.9375rem; flex: 1; }
.hamburger-btn {
  background: none; border: none;
  display: flex; flex-direction: column; gap: 5px;
  padding: var(--sp-2); border-radius: var(--r-sm);
}
.hamburger-btn span { display:block; width:22px; height:2px; background:#fff; border-radius:2px; }

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .sidebar-overlay.visible { display: block; }
  .mobile-header { display: flex; }
}
</style>
