<script>
const AppData = (() => {

  const FIELD_MAP = {
    announcementMsg:    'announcementMsg',
    applicationDeadline:'deadlineDate',
    sharedDates:        'sharedDates',
    sharedDates2:       'sharedDates2',
    sharedSessionI:     'sharedSessionI',
    sharedSessionII:    'sharedSessionII',
    eliteSessIDates:    'eliteSessIDates',
    eliteSessIIDates:   'eliteSessIIDates',
    eliteHours:         'eliteHours',
    eliteHours2:        'eliteHours2',
    eliteNoSchool:      'eliteNoSchool',
    helixDates:         'helixDates',
    helixDates2:        'helixDates2',
    helixSessIHours:    'helixSessIHours',
    helixSessIIHours:   'helixSessIIHours',
    helixNoSchool:      'helixNoSchool',
    steeleDates:        'steeleDates',
    steeleDates2:       'steeleDates2',
    steeleSessIHours:   'steeleSessIHours',
    steeleSessIIHours:  'steeleSessIIHours',
    steeleNoSchool:     'steeleNoSchool',
    contactName:        'contactName',
    contactEmail:       'contactEmail',
    contactPhone:       'contactPhone',
    additionalInfo:     'additionalInfo'
  };

  function setText(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    
    if (id === 'deadlineDate' && value !== undefined) {
      const dateObj = new Date(value);
      if (!isNaN(dateObj)) {
        value = dateObj.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      }
    }
    
    // Automatically apply formatting if field is blank
    if (value === undefined || value === null || String(value).trim() === '') {
      el.innerHTML = 'N/A';
      el.style.fontWeight = '500';
      el.style.color = 'var(--color-text-muted)';
      el.style.fontStyle = 'italic';
    } else {
      el.innerHTML = value; 
      el.style.color = ''; 
      el.style.fontStyle = ''; 
      el.style.fontWeight = '';
    }
  }

  function populatePage(data) {
    for (const [key, elId] of Object.entries(FIELD_MAP)) {
      setText(elId, data[key]);
    }
  }

  function hideLoading() { document.getElementById('loadingOverlay')?.classList.add('hidden'); }
  function showLoadError() {
    const el = document.getElementById('loadingOverlay');
    if (el) el.innerHTML = `<div style="text-align:center;color:var(--color-text-muted);"><p>Could not load program info.<br>Please refresh or contact HR.</p></div>`;
  }

  function init() {
    google.script.run
      .withSuccessHandler(result => {
        hideLoading();
        if (result && result.success) populatePage(result.data);
        else showLoadError();
      }).withFailureHandler(() => { hideLoading(); showLoadError(); }).getAdminInfo();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  return { init };

})();
</script>
