<script>
/* ============================================================
   JS_Admin.html — Admin panel: auth verification, field
   population, and saving changes back to the spreadsheet
============================================================ */

const AppAdmin = (() => {

  // Maps spreadsheet keys → admin field input IDs
  const ADMIN_FIELDS = {
    announcementMsg:    'admin-announcementMsg',
    applicationDeadline:'admin-applicationDeadline',
    // Shared schedule
    sharedDates:        'admin-sharedDates',
    sharedDates2:       'admin-sharedDates2',
    sharedSessionI:     'admin-sharedSessionI',
    sharedSessionII:    'admin-sharedSessionII',
    // ELITE
    eliteSessIDates:    'admin-eliteSessIDates',
    eliteSessIIDates:   'admin-eliteSessIIDates',
    eliteHours:         'admin-eliteHours',
    eliteHours2:        'admin-eliteHours2',
    eliteNoSchool:      'admin-eliteNoSchool',
    // Helix
    helixDates:         'admin-helixDates',
    helixDates2:        'admin-helixDates2',
    helixSessIHours:    'admin-helixSessIHours',
    helixSessIIHours:   'admin-helixSessIIHours',
    helixNoSchool:      'admin-helixNoSchool',
    // Steele
    steeleDates:        'admin-steeleDates',
    steeleDates2:       'admin-steeleDates2',
    steeleSessIHours:   'admin-steeleSessIHours',
    steeleSessIIHours:  'admin-steeleSessIIHours',
    steeleNoSchool:     'admin-steeleNoSchool',
    // Contact
    contactName:        'admin-contactName',
    contactEmail:       'admin-contactEmail',
    contactPhone:       'admin-contactPhone',
    additionalInfo:     'admin-additionalInfo'
  };

  function setStatus(msg, type) {
    const el = document.getElementById('adminSaveStatus');
    if (!el) return;
    el.textContent = msg;
    el.className = 'admin-save-status ' + (type || '');
  }

  function populateFields(data) {
    for (const [key, fieldId] of Object.entries(ADMIN_FIELDS)) {
      const el = document.getElementById(fieldId);
      if (el && data[key] !== undefined) el.value = data[key];
    }
  }

  function collectFields() {
    const updates = {};
    for (const [key, fieldId] of Object.entries(ADMIN_FIELDS)) {
      const el = document.getElementById(fieldId);
      if (el) updates[key] = el.value.trim();
    }
    return updates;
  }

  function save() {
    const saveBtn = document.getElementById('adminSaveBtn');
    if (saveBtn) saveBtn.disabled = true;
    setStatus('Saving…', 'saving');

    const updates = collectFields();

    google.script.run
      .withSuccessHandler(res => {
        if (saveBtn) saveBtn.disabled = false;
        if (res && res.success) {
          setStatus('✓ Changes saved successfully!', 'saved');
          // Also refresh the home tab live data
          AppData.init();
          setTimeout(() => setStatus('', ''), 4000);
        } else {
          setStatus('Error: ' + (res.error || 'Unknown error.'), 'error');
        }
      })
      .withFailureHandler(err => {
        if (saveBtn) saveBtn.disabled = false;
        setStatus('Server error. Please try again.', 'error');
        console.error(err);
      })
      .saveAdminInfo(updates);
  }

  function init() {
    // Only run if the admin panel exists in the DOM
    const panel = document.getElementById('tab-admin');
    if (!panel) return;

    // Verify access server-side
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.isAdmin) {
          // Load current values into fields
          google.script.run
            .withSuccessHandler(infoRes => {
              if (infoRes && infoRes.success) populateFields(infoRes.data);
            })
            .withFailureHandler(() => {})
            .getAdminInfo();
        } else {
          // Show access denied state
          const content = document.getElementById('adminPanelContent');
          const denied  = document.getElementById('adminDenied');
          if (content) content.style.display = 'none';
          if (denied)  denied.style.display  = 'flex';
        }
      })
      .withFailureHandler(() => {
        const content = document.getElementById('adminPanelContent');
        const denied  = document.getElementById('adminDenied');
        if (content) content.style.display = 'none';
        if (denied)  denied.style.display  = 'flex';
      })
      .checkAdminAccess();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  return { save };

})();
</script>
