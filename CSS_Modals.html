<style>
/* ============================================================
   CSS_Modals.html — Success / Error modal overlay styles
============================================================ */

.modal-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(15,35,64,0.55);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  z-index: 200; align-items: center; justify-content: center;
  padding: var(--sp-5); animation: backdropIn 200ms ease;
}
.modal-backdrop.visible { display: flex; }
@keyframes backdropIn { from { opacity:0; } to { opacity:1; } }

.modal {
  background: var(--color-surface); border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  padding: var(--sp-10) var(--sp-8);
  max-width: 440px; width: 100%;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-4);
  animation: modalIn 240ms cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modalIn {
  from { opacity:0; transform:scale(0.88) translateY(12px); }
  to   { opacity:1; transform:scale(1)    translateY(0); }
}

.modal-icon {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: var(--sp-2); flex-shrink: 0;
}
.modal-icon svg { width: 30px; height: 30px; }
.modal-icon--success { background:#dcfce7; color:#16a34a; box-shadow:0 0 0 8px #f0fdf4; }
.modal-icon--error   { background:#fee2e2; color:#dc2626; box-shadow:0 0 0 8px #fef2f2; }

.modal-title { font-size: 1.25rem; font-weight: 700; color: var(--color-text); }
.modal-body  { font-size: 0.9375rem; color: var(--color-text-sub); line-height: 1.6; max-width: 320px; }
.modal-close-btn { margin-top: var(--sp-2); min-width: 140px; padding: var(--sp-3) var(--sp-8); font-size: 0.9375rem; }

@media (max-width: 480px) { .modal { padding: var(--sp-8) var(--sp-5); } }
</style>
